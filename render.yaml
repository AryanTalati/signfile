services:
  - type: web
    name: signfile
    runtime: docker
    plan: free
    region: oregon # same region as Supabase (us-west-2)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/live
    autoDeploy: true
    envVars:
      # Secrets: values are entered in the Render dashboard, never in this file.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: signfile
